name: observatory
description: Check a pull request or a push against the rules in .observatory
inputs:
  scope:
    description: Arguments for `observatory run`, such as `--all` or `--commit HEAD`. Empty means the changes of the pull request.
    default: ""
  anthropic-api-key:
    description: The Anthropic API key. Store it in a secret. For an other provider, set its key with `env` on the job instead.
    required: false
  version:
    description: The release tag to install, such as `v1.2.0`. The value `latest` installs the newest release.
    default: latest
runs:
  using: composite
  steps:
    - name: Install the observatory release binary
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: Open-Source-Lodge/observatory
        VERSION: ${{ inputs.version }}
      run: |
        if [ "$VERSION" = latest ]; then
          VERSION=$(gh release view --repo "$REPO" --json tagName -q .tagName)
        fi
        case "$RUNNER_OS" in Linux) os=linux ;; macOS) os=darwin ;; Windows) os=windows ;; esac
        case "$RUNNER_ARCH" in X64) arch=amd64 ;; ARM64) arch=arm64 ;; esac
        ext=""
        if [ "$os" = windows ]; then ext=.exe; fi
        dir="$RUNNER_TEMP/observatory"
        gh release download "$VERSION" --repo "$REPO" --dir "$dir" \
          --pattern "observatory-$os-$arch$ext" --pattern checksums.txt
        # macOS has shasum, but no sha256sum.
        command -v sha256sum > /dev/null || sha256sum() { shasum -a 256 "$@"; }
        (cd "$dir" && sha256sum -c --ignore-missing checksums.txt)
        mv "$dir/observatory-$os-$arch$ext" "$dir/observatory$ext"
        chmod +x "$dir/observatory$ext"
        echo "$dir" >> "$GITHUB_PATH"
    - run: observatory run ${{ inputs.scope }}
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
