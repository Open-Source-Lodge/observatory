<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" role="img" aria-label="Observatory logo">
  <!-- The dome is a calotte enclosure. The TMT International Observatory gave the idea for it. -->
  <clipPath id="frame"><rect width="520" height="200" rx="16"/></clipPath>
  <rect width="520" height="200" rx="16" fill="#0b1b3a"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.6"/>
    <circle cx="82" cy="18" r="1.1"/>
    <circle cx="150" cy="26" r="1.4"/>
    <circle cx="195" cy="52" r="1"/>
    <circle cx="228" cy="22" r="1.6"/>
    <circle cx="300" cy="40" r="1.1"/>
    <circle cx="360" cy="18" r="1.4"/>
    <circle cx="430" cy="34" r="1"/>
    <circle cx="482" cy="24" r="1.6"/>
    <circle cx="500" cy="70" r="1.1"/>
    <circle cx="24" cy="80" r="1"/>
  </g>

  <!-- mountain -->
  <path d="M0 200 Q110 120 250 176 Q400 200 520 190 L520 200 Z" fill="#132a54" clip-path="url(#frame)"/>

  <!-- enclosure base -->
  <path d="M62 116 H158 V150 A48 8 0 0 1 62 150 Z" fill="#6d7d9c"/>
  <ellipse cx="110" cy="116" rx="48" ry="8" fill="#8896b4"/>

  <!-- dome -->
  <circle cx="110" cy="96" r="50" fill="#dbe3f2"/>
  <path d="M60 96 A50 50 0 0 1 160 96" fill="none" stroke="#f5f8ff" stroke-width="2"/>

  <!-- aperture, with the segmented mirror inside -->
  <g transform="translate(126 74) rotate(-32)">
    <ellipse rx="16" ry="27" fill="#0b1b3a"/>
    <g fill="none" stroke="#7fb3ff" stroke-width="1.6" transform="scale(1 1.5)">
      <polygon points="0,-7 6,-3.5 6,3.5 0,7 -6,3.5 -6,-3.5"/>
      <polygon points="0,-7 6,-3.5 6,3.5 0,7 -6,3.5 -6,-3.5" transform="translate(-12 0) scale(0.55)"/>
      <polygon points="0,-7 6,-3.5 6,3.5 0,7 -6,3.5 -6,-3.5" transform="translate(12 0) scale(0.55)"/>
    </g>
    <ellipse rx="16" ry="27" fill="none" stroke="#b7c6e6" stroke-width="2"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="1">observatory</text>
  <text x="203" y="140" fill="#9fb4dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3">RULES IN PLAIN LANGUAGE</text>
</svg>
