name: observatory

# Check the changes of a pull request against the rules in .observatory,
# with the observatory in this repository and the GitHub Copilot CLI.
on:
  pull_request:

permissions:
  contents: read
  copilot-requests: write

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # observatory needs the history back to the base branch
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm install -g @github/copilot
      - run: go run . run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVATORY_PROVIDER: copilot
          OBSERVATORY_MODEL: auto
