name: observatory

# Check the changes of a pull request against the rules in .observatory,
# with the observatory in this repository and the GitHub Copilot CLI.
on:
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # observatory needs the history back to the base branch
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: npm install -g @github/copilot
      # Check the changes between the base branch of the pull request and
      # the pull request head.
      - run: go run . run --base origin/${{ github.base_ref }}
        env:
          # A fine-grained personal access token with the "Copilot Requests" permission.
          # The token uses the Copilot subscription of its owner, not of the organization.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          OBSERVATORY_PROVIDER: copilot
          OBSERVATORY_MODEL: auto
